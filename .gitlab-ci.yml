# CI for the bundle itself (the templates under workspace/dev/ci/ are for the projects that install it).
#
# Two jobs, both deterministic, both able to fail:
#   test   — the script tests (state index, linter, status board, design system)
#            and the bundle self-lint (names, sizes, wiring, contract citations).
#   doctor — the install preflight run against this checkout, so a missing file is caught here
#            rather than on a user's machine.

image: node:22

stages: [test]

test:
  stage: test
  script:
    - node --version
    - node --test tests/*.test.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

doctor:
  stage: test
  script:
    - node workspace/dev/scripts/doctor.mjs
    - node workspace/dev/scripts/contracts.mjs 12
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
