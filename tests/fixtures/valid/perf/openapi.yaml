# A contract whose every operation carries its x-perf budget (DEV-CONTRACTS §13.1, §13.7).
# perf.test.mjs copies it to a scratch dev/api/demo/ for lint-dev, and serves it to perf-smoke.
openapi: 3.1.0
info:
  title: demo
  version: 1.0.0
paths:
  /fast:
    get:
      operationId: getFast
      x-perf: { p95_ms: 400, max_queries: 3, max_payload_kb: 4 }   # flow map
      responses:
        '200': { description: ok }
  /items:
    get:
      operationId: listItems
      x-perf:
        p95_ms: 500
        max_queries: 4
        max_payload_kb: 16
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200': { description: ok }
    post:
      operationId: createItem
      x-perf: { p95_ms: 300, max_queries: 2, max_payload_kb: 2 }
      responses:
        '201': { description: created }
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getItem
      x-perf: { p95_ms: 200, max_queries: 2, max_payload_kb: 4 }
      x-timeout-ms: 1000
      x-cache: private:30   # the server sends Cache-Control and answers 304 to its ETag
      responses:
        '200': { description: ok }
components:
  schemas:
    get:
      description: a schema named like a method, outside paths — never an operation
