<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>fixture</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 14px/20px system-ui, sans-serif; color: #18181b; background: #fff; }
header { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 16px 24px; }
h1 { font-size: 28px; line-height: 1.2; margin: 0; }
h2 { font-size: 20px; line-height: 1.25; margin: 0 0 8px; }
main { padding: 0 24px 24px; display: grid; gap: 16px; min-width: 0; }
main > * { min-width: 0; }
.card { border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px; }
.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e4e4e7; white-space: nowrap; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.btn { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #d4d4d8; background: #fff; }
.btn.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 0 8px; border-radius: 999px; }
[data-status="success"] { color: #15803d; } [data-status="danger"] { color: #dc2626; } [data-status="warning"] { color: #a16207; }
[data-empty] { text-align: center; padding: 24px; }
p { margin: 0 0 8px; }
.spacer { height: 2000px; } .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 160px; padding: 16px 24px; background: #fff; border-top: 1px solid #e4e4e7; }
</style></head><body>
<header><h1>Releases</h1><div><button class="btn primary">New release</button></div></header><main><section class="card"><h2>Notes</h2><p>A long page.</p></section><div class="spacer"></div><p><a href="#more">Read the release notes</a></p></main><div class="bar"><p>Unsaved changes</p></div><nav style="position:fixed;left:0;top:0;width:200px;transform:translateX(-105%)"><a href="#a">Off-screen drawer link</a></nav>
</body></html>
