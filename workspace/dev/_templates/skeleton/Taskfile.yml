# https://taskfile.dev — the one entry point a person and CI both use (DEV-CONTRACTS §18.2).
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev
  # A per-run database name, so two checks on one machine never drop each other's database (§18.6).
  DB_NAME: '{{.DB_NAME | default "app"}}_{{.RUN_ID | default "local"}}'

tasks:
  setup:
    desc: Install dependencies, create .env from .env.example, enable the git hooks.
    cmds:
      - git config core.hooksPath .sdlc/ci/git-hooks
      - test -f .env || cp .env.example .env
      - go mod download
      - npm ci

  dev:
    desc: Run the app locally against a database in Docker.
    cmds:
      - docker compose up -d db
      - go run -ldflags "-X main.version={{.VERSION}}" ./cmd/server

  seed:
    desc: Load invented demo data (DEV-PROFILE `Allowed data domains` only).
    cmds:
      - go run ./cmd/seed
      - node .sdlc/scripts/data-guard.mjs --source .

  build:
    desc: Build the binary; `server --version` prints the SemVer from git.
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/server ./cmd/server

  check:fast:
    desc: Lint, types and unit tests — under 2 minutes, before every commit.
    cmds:
      - gofmt -l . && go vet ./...
      - go test -short ./...
      - npx tsc --noEmit && npx vitest run

  licenses:
    desc: Fail on a dependency licence outside DEV-PROFILE §Dependencies.
    cmds:
      - go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0
      - npx --yes license-checker-rseidelsohn@4.4.2 --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;MPL-2.0;0BSD;CC0-1.0;Unlicense"

  check:
    desc: The whole gate CI runs. In CI a test whose variable is unset fails; it never skips (§18.6).
    env:
      DB_NAME: '{{.DB_NAME}}'
    cmds:
      - task: check:fast
      - task: licenses
      - go test -race -tags=integration ./...
      - node .sdlc/scripts/skeleton-check.mjs --source .
